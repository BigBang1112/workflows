name: Publish Artifact (Combined)

on:
  workflow_call:
    inputs:
      project:
        description: Path/name of the project to publish (e.g. src/MyApp or MyApp)
        type: string
        required: true
      artifact-name:
        description: Base name for the generated zip file (e.g. MyPlugin)
        type: string
        required: true
      artifact-root:
        description: Directory inside the zip to place the merged output under (e.g. MyPlugin). Leave empty to place the output at the root of the zip.
        type: string
        default: ''
      artifact-ignore:
        description: Newline-separated list of file patterns to exclude from the zip (e.g. *.pdb). Patterns containing '/' are matched against the relative path, others against the file name.
        type: string
        default: ''
      build-matrix:
        description: JSON array of {os, runtime, executable-extension} objects
        type: string
        default: '[{"os":"windows-latest","runtime":"win-x64","executable-extension":".exe"},{"os":"ubuntu-latest","runtime":"linux-x64","executable-extension":""}]'
      dotnet-version:
        description: .NET version to use
        type: string
        default: latest
      artifact-folder:
        description: Intermediate folder name used when merging build artifacts
        type: string
        default: Plugin

permissions:
  contents: write # important for release description edit and asset upload
  packages: read

jobs:
  prepare-description:
    name: Prepare Release Description
    if: github.event_name == 'release'
    runs-on: ubuntu-slim

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BODY: ${{ github.event.release.body }}

    steps:
      - name: Set release information
        run: |
          FINAL_BODY="***[Release is being automatically created, please wait...](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})***

          $RELEASE_BODY"
          gh release edit ${{ github.ref_name }} -n "$FINAL_BODY" --repo ${{ github.repository }}

  build:
    needs: prepare-description

    # Run this job even if prepare-description fails
    if: always()

    name: Build Executables
    strategy:
      matrix:
        include: ${{ fromJson(inputs.build-matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Publish application
        run: dotnet publish ${{ inputs.project }} -c Release -r ${{ matrix.runtime }} -o ./publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: ./publish/*

  package:
    needs: build
    name: Package & Upload
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: ./${{ inputs.artifact-folder }}
          merge-multiple: true

      - name: Remove ignored files
        if: inputs.artifact-ignore != ''
        shell: bash
        run: |
          while IFS= read -r pattern; do
            pattern="$(echo "$pattern" | xargs)"
            [ -z "$pattern" ] && continue
            if [[ "$pattern" == */* ]]; then
              find ${{ inputs.artifact-folder }} -type f -path "${{ inputs.artifact-folder }}/$pattern" -delete
            else
              find ${{ inputs.artifact-folder }} -type f -name "$pattern" -delete
            fi
          done <<< "${{ inputs.artifact-ignore }}"

      - name: Prepare zip output directory
        if: inputs.artifact-root != '' && inputs.artifact-root != inputs.artifact-folder
        shell: bash
        run: |
          mkdir -p "${{ inputs.artifact-root }}"
          shopt -s dotglob
          mv ${{ inputs.artifact-folder }}/* "${{ inputs.artifact-root }}"/

      - name: Zip
        shell: bash
        run: |
          SRC_DIR="${{ inputs.artifact-root != '' && inputs.artifact-root || inputs.artifact-folder }}"
          if [ "$SRC_DIR" == "${{ inputs.artifact-folder }}" ]; then
            cd "$SRC_DIR"
            zip -r "../${{ inputs.artifact-name }}.zip" .
            cd ..
          else
            zip -r "${{ inputs.artifact-name }}.zip" "$SRC_DIR"
          fi

      - name: Calculate SHA256
        id: calc_sha
        shell: bash
        run: |
          HASH=$(sha256sum "${{ inputs.artifact-name }}.zip" | awk '{print $1}')
          echo "## SHA256 Checksum" >> $GITHUB_STEP_SUMMARY
          echo "\`${HASH}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload ${{ inputs.artifact-name }}.zip to this release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} ${{ inputs.artifact-name }}.zip --repo ${{ github.repository }}

  finalize:
    needs: [build, package]
    
    # Run this job even if package fails so we can update the release description,
    # or to clean up the release if build fails
    if: always() && github.event_name == 'release'

    runs-on: ubuntu-slim
    name: Finalize Release

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BODY: ${{ github.event.release.body }}

    steps:
      - name: Delete release and tag on build failure
        if: needs.build.result == 'failure' || needs.build.result == 'cancelled'
        run: gh release delete ${{ github.ref_name }} --repo ${{ github.repository }} --yes --cleanup-tag

      - name: Set final release information
        if: needs.build.result != 'failure' && needs.build.result != 'cancelled'
        run: |
          if [ "${{ needs.package.result }}" == "success" ]; then
            STATUS_MSG="Assets were automatically generated using the [publish workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          else
            STATUS_MSG=$'> [!WARNING]\n> The [publish workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed. Some assets may be missing.'
          fi

          FINAL_BODY="${RELEASE_BODY}

          $STATUS_MSG"

          gh release edit ${{ github.ref_name }} -n "$FINAL_BODY" --repo ${{ github.repository }}
