name: Publish NuGet Packages (Immutable Release)

on:
  workflow_call:
    inputs:
      package-prefix:
        description: Prefix filter for NuGet package selection (e.g. "MyCompany.")
        type: string
        default: ""
      project-path:
        description: Newline-separated project paths or globs to build. Defaults to the solution or project in the repository root.
        type: string
        default: ""
      test-path:
        description: Newline-separated test-project paths or globs. Defaults to dotnet test discovery in the repository root.
        type: string
        default: ""
      pack-path:
        description: Newline-separated project paths or globs to pack. Defaults to project-path, then the repository root.
        type: string
        default: ""
      dotnet-version:
        description: .NET version to use
        type: string
        default: latest
      workloads:
        description: Additional workloads to install (e.g. wasm-tools)
        type: string
        default: ""
      enable-tests:
        description: Run tests
        type: boolean
        default: true
      enable-coverage:
        description: Generate and publish code coverage summary
        type: boolean
        default: true
      push-to-nuget:
        description: Publish packages to NuGet.org
        type: boolean
        default: true
      push-to-github:
        description: Publish packages to GitHub Packages
        type: boolean
        default: true
      push-to-custom-feeds:
        description: Publish packages to custom NuGet feeds (requires custom-feed-urls and CUSTOM_FEED_API_KEYS)
        type: boolean
        default: false
      custom-feed-urls:
        description: Newline-separated list of custom NuGet feed source URLs to push packages to
        type: string
        default: ""
      upload-to-release:
        description: Upload packages to the GitHub Release
        type: boolean
        default: true
      main-project:
        description: Package name of the main project, used for the release tag/version and the unheaded first release-notes section. When empty, the highest newly pushed version determines the tag and every package's release notes have a header.
        type: string
        default: ""
      create-release:
        description: Create a GitHub Release (with tag) from the newly pushed packages
        type: boolean
        default: true
      send-discord-message:
        description: Send the release notes to Discord
        type: boolean
        default: false
      discord-top-lines:
        description: Newline-separated lines inserted below the heading, before the release notes, in the Discord message. Ignored if the Discord webhook secret isn't set.
        type: string
        default: ""
      discord-bottom-lines:
        description: Newline-separated lines appended at the very end of the Discord message. Ignored if the Discord webhook secret isn't set.
        type: string
        default: ""
      release-title-prefix:
        description: Optional text prepended to the GitHub Release title, separated from the version by one space. Defaults to empty, which results in the release title being the version only.
        type: string
        default: ""
    secrets:
      NUGET_API_KEY:
        required: false
      CUSTOM_FEED_API_KEYS:
        description: Newline-separated list of API keys matching the order of custom-feed-urls
        required: false
      DISCORD_WEBHOOK_URL:
        description: Discord webhook URL. When set, the constructed release notes are posted to it, split to respect Discord's per-message character limit.
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-nuget-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test, and publish NuGet packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # A reusable workflow's normal checkout is the caller repository. Fetch the
      # helper from the exact commit that supplied this workflow so callers do not
      # need to copy it into their own repositories.
      - name: Checkout publish helper
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _publish-nuget-immutable-helper
          sparse-checkout: .github/scripts

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install .NET workloads
        if: inputs.workloads != ''
        shell: bash
        env:
          WORKLOADS: ${{ inputs.workloads }}
        run: |
          workloads="${WORKLOADS//,/ }"
          dotnet workload install $workloads

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test publish helper
        run: python _publish-nuget-immutable-helper/.github/scripts/test_publish_nuget_immutable.py

      - name: Build
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          if [[ -z "$PROJECT_PATH" ]]; then
            dotnet build -c Release -p:ContinuousIntegrationBuild=true
            exit 0
          fi
          while IFS= read -r pattern || [[ -n "$pattern" ]]; do
            [[ -z "$pattern" ]] && continue
            mapfile -t projects < <(compgen -G "$pattern" || true)
            ((${#projects[@]})) || { echo "No projects match: $pattern" >&2; exit 1; }
            for project in "${projects[@]}"; do
              dotnet build "$project" -c Release -p:ContinuousIntegrationBuild=true
            done
          done <<< "$PROJECT_PATH"

      - name: Test
        if: inputs.enable-tests
        shell: bash
        env:
          TEST_PATH: ${{ inputs.test-path }}
        run: |
          set -euo pipefail
          if [[ -z "$TEST_PATH" ]]; then
            dotnet test -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage
            exit 0
          fi
          while IFS= read -r pattern || [[ -n "$pattern" ]]; do
            [[ -z "$pattern" ]] && continue
            mapfile -t projects < <(compgen -G "$pattern" || true)
            ((${#projects[@]})) || { echo "No test projects match: $pattern" >&2; exit 1; }
            for project in "${projects[@]}"; do
              dotnet test "$project" -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage
            done
          done <<< "$TEST_PATH"

      - name: Generate code coverage summary
        if: inputs.enable-tests && inputs.enable-coverage
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coveragereport" -reporttypes:"MarkdownSummaryGithub"
          cat ./coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Pack packages
        shell: bash
        env:
          PACK_PATH: ${{ inputs.pack-path }}
          PROJECT_PATH: ${{ inputs.project-path }}
          PACKAGE_PREFIX: ${{ inputs.package-prefix }}
        run: |
          set -euo pipefail
          mkdir -p packages
          pack_path="${PACK_PATH:-$PROJECT_PATH}"
          if [[ -z "$pack_path" ]]; then
            dotnet pack -c Release -p:ContinuousIntegrationBuild=true --output ./packages
          else
            while IFS= read -r pattern || [[ -n "$pattern" ]]; do
              [[ -z "$pattern" ]] && continue
              mapfile -t projects < <(compgen -G "$pattern" || true)
              ((${#projects[@]})) || { echo "No projects to pack match: $pattern" >&2; exit 1; }
              for project in "${projects[@]}"; do
                dotnet pack "$project" -c Release -p:ContinuousIntegrationBuild=true --output ./packages
              done
            done <<< "$pack_path"
          fi
          python _publish-nuget-immutable-helper/.github/scripts/publish_nuget_immutable.py prepare

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            packages/${{ inputs.package-prefix }}*.nupkg
            packages/${{ inputs.package-prefix }}*.snupkg
          if-no-files-found: error

      - name: Publish packages
        id: publish
        env:
          PUSH_TO_NUGET: ${{ inputs.push-to-nuget }}
          PUSH_TO_GITHUB: ${{ inputs.push-to-github }}
          PUSH_TO_CUSTOM_FEEDS: ${{ inputs.push-to-custom-feeds }}
          CUSTOM_FEED_URLS: ${{ inputs.custom-feed-urls }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CUSTOM_FEED_API_KEYS: ${{ secrets.CUSTOM_FEED_API_KEYS }}
        run: python _publish-nuget-immutable-helper/.github/scripts/publish_nuget_immutable.py publish

      - name: Create release from newly uploaded packages
        if: steps.publish.outputs.has-new == 'true' && inputs.create-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PROJECT: ${{ inputs.main-project }}
          UPLOAD_TO_RELEASE: ${{ inputs.upload-to-release }}
          RELEASE_TITLE_PREFIX: ${{ inputs.release-title-prefix }}
        run: python _publish-nuget-immutable-helper/.github/scripts/publish_nuget_immutable.py release

      - name: Send message to Discord
        if: steps.release.outputs.created == 'true' && inputs.send-discord-message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          MAIN_PROJECT: ${{ inputs.main-project }}
          DISCORD_TOP_LINES: ${{ inputs.discord-top-lines }}
          DISCORD_BOTTOM_LINES: ${{ inputs.discord-bottom-lines }}
        run: python _publish-nuget-immutable-helper/.github/scripts/publish_nuget_immutable.py discord

      - name: Report feed failures
        if: steps.publish.outputs.has-failures == 'true'
        run: |
          echo 'One or more package feeds rejected an upload; see the publish summary.' >&2
          exit 1
