name: Publish Artifact (Immutable)

on:
  workflow_call:
    inputs:
      project:
        description: Path to the project file (e.g. src/MyApp/MyApp.csproj) to extract version and build from.
        type: string
        required: true
      artifact-name:
        description: Base name for the generated zip files (e.g. MyApp)
        type: string
        required: true
      artifact-root:
        description: Directory inside the zip to place the published output under (e.g. MyApp). Leave empty for root.
        type: string
        default: ''
      artifact-ignore:
        description: Newline-separated list of file patterns to exclude from the zip (e.g. *.pdb).
        type: string
        default: ''
      build-matrix:
        description: JSON array of {os, runtime} objects
        type: string
        default: '[{"os":"windows-latest","runtime":"win-x64"},{"os":"ubuntu-latest","runtime":"linux-x64"}]'
      dotnet-version:
        description: .NET version to use
        type: string
        default: latest
      publish-release:
        description: Create a GitHub Release (with tag) from the newly built ZIPs
        type: boolean
        default: true
      discord-description:
        description: Newline-separated lines inserted below the heading, before the changelog, in the Discord message.
        type: string
        default: ""
      discord-footer:
        description: Newline-separated lines appended at the very end of the Discord message.
        type: string
        default: ""
    secrets:
      DISCORD_WEBHOOK_URL:
        description: Discord webhook URL.
        required: false

permissions:
  contents: write # important for release creation and asset upload
  packages: read

jobs:
  metadata:
    name: Extract Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      version: ${{ steps.extract.outputs.version }}
    
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Extract version
        id: extract
        shell: bash
        run: |
          PROPS=$(dotnet msbuild "${{ inputs.project }}" -nologo -getProperty:Version,VersionPrefix 2>/dev/null) || PROPS='{}'
          VERSION=$(echo "$PROPS" | jq -r '.Properties.VersionPrefix // empty')
          if [ -z "$VERSION" ]; then
            VERSION=$(echo "$PROPS" | jq -r '.Properties.Version // empty')
          fi

          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from ${{ inputs.project }}"
            exit 1
          fi

          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: v${VERSION}"

  build:
    needs: metadata
    name: Build (${{ matrix.runtime }})
    strategy:
      matrix:
        include: ${{ fromJson(inputs.build-matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Publish ${{ matrix.runtime }}
        run: dotnet publish ${{ inputs.project }} -c Release -r ${{ matrix.runtime }} -o ${{ inputs.artifact-root != '' && format('./publish/{0}', inputs.artifact-root) || './publish' }}

      - name: Remove ignored files
        if: inputs.artifact-ignore != ''
        shell: bash
        run: |
          while IFS= read -r pattern; do
            pattern="$(echo "$pattern" | xargs)"
            [ -z "$pattern" ] && continue
            if [[ "$pattern" == */* ]]; then
              find publish -type f -path "publish/$pattern" -delete
            else
              find publish -type f -name "$pattern" -delete
            fi
          done <<< "${{ inputs.artifact-ignore }}"

      - name: Zip (Linux/Mac)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd publish
          zip -r "../${{ inputs.artifact-name }}.${{ needs.metadata.outputs.tag }}.${{ matrix.runtime }}.zip" .
          cd ..

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "publish\*" -DestinationPath "${{ inputs.artifact-name }}.${{ needs.metadata.outputs.tag }}.${{ matrix.runtime }}.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.runtime }}
          path: ${{ inputs.artifact-name }}.${{ needs.metadata.outputs.tag }}.${{ matrix.runtime }}.zip

  publish:
    needs: [metadata, build]
    name: Package & Publish
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.create_release.outputs.url }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: ./zips
          merge-multiple: true

      - name: Extract release changelog
        id: changelog
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "${{ inputs.project }}")
          CHANGELOG_FILE="${PROJECT_DIR}/Changelogs/${{ needs.metadata.outputs.tag }}.md"
          NOTES_FILE="changelog_github.md"
          > "$NOTES_FILE"

          if [ -f "$CHANGELOG_FILE" ]; then
            cat "$CHANGELOG_FILE" >> "$NOTES_FILE"
          else
            echo "*No changelog found.*" >> "$NOTES_FILE"
          fi
          
          # Save a clean copy for Discord
          cp "$NOTES_FILE" changelog.md

          # Append the automated workflow note
          echo -e "\n\nAssets were automatically generated using the [publish workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})." >> "$NOTES_FILE"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md

      - name: Create GitHub Release
        id: create_release
        if: inputs.publish-release == 'true'
        run: |
          URL=$(gh release create "${{ needs.metadata.outputs.tag }}" \
            ./zips/*.zip \
            --title "${{ needs.metadata.outputs.version }}" \
            --notes-file changelog_github.md \
            --repo ${{ github.repository }})

          echo "url=$URL" >> "$GITHUB_OUTPUT"

  discord:
    needs: [metadata, publish]
    if: always() && needs.publish.result == 'success' && inputs.publish-release == 'true'
    name: Notify Discord
    runs-on: ubuntu-slim

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Download changelog artifact
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: ./notes

      - name: Send announcement to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          TOP_LINES: ${{ inputs.discord-description }}
          BOTTOM_LINES: ${{ inputs.discord-footer }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_URL: ${{ needs.publish.outputs.url }}
        run: |
          set -euo pipefail

          {
            echo "## ${VERSION}"
            if [ -n "$TOP_LINES" ]; then
              echo "$TOP_LINES"
            fi
            echo
            cat ./notes/changelog.md
            echo
            echo "GitHub: [Release Link](<${RELEASE_URL}>)"
            if [ -n "$BOTTOM_LINES" ]; then
              echo "$BOTTOM_LINES"
            fi
          } > discord_message.md

          # Split into <=2000 char chunks, only breaking on line boundaries.
          LIMIT=2000
          CONTENT="$(cat discord_message.md)"
          i=0
          while [ -n "$CONTENT" ]; do
            if [ "${#CONTENT}" -le "$LIMIT" ]; then
              CHUNK="$CONTENT"
              CONTENT=""
            else
              HEAD="${CONTENT:0:$LIMIT}"
              CUT=$(printf '%s' "$HEAD" | grep -bo $'\n' | tail -1 | cut -d: -f1)
              if [ -z "$CUT" ]; then
                CUT=$LIMIT
                CHUNK="${CONTENT:0:$CUT}"
                CONTENT="${CONTENT:$CUT}"
              else
                CHUNK="${CONTENT:0:$CUT}"
                CONTENT="${CONTENT:$((CUT+1))}"
              fi
            fi
            printf '%s' "$CHUNK" > "chunk_$(printf '%03d' "$i").md"
            i=$((i+1))
          done

          for f in chunk_*.md; do
            PAYLOAD=$(jq -Rs '{content: .}' < "$f")
            curl -fsSL -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          done