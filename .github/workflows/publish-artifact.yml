name: Publish Artifact

on:
  workflow_call:
    inputs:
      project:
        description: Path to the project to publish (e.g. src/MyApp)
        type: string
        required: true
      artifact-name:
        description: Base name for the generated zip files (e.g. MyApp)
        type: string
        required: true
      artifact-root:
        description: Directory inside the zip to place the published output under (e.g. MyApp). Leave empty to place the output at the root of the zip.
        type: string
        default: ''
      artifact-ignore:
        description: Newline-separated list of file patterns to exclude from the zip (e.g. *.pdb). Patterns containing '/' are matched against the relative path, others against the file name.
        type: string
        default: ''
      build-matrix:
        description: JSON array of {os, runtime} objects
        type: string
        default: '[{"os":"windows-latest","runtime":"win-x64"},{"os":"ubuntu-latest","runtime":"linux-x64"}]'
      dotnet-version:
        description: .NET version to use
        type: string
        default: latest

permissions:
  contents: write # important for release description edit and asset upload

jobs:
  prepare-description:
    name: Prepare Release Description
    if: github.event_name == 'release'
    runs-on: ubuntu-slim

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BODY: ${{ github.event.release.body }}

    steps:
      - name: Set release information
        run: |
          FINAL_BODY="***[Release is being automatically created, please wait...](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})***

          $RELEASE_BODY"
          gh release edit ${{ github.ref_name }} -n "$FINAL_BODY" --repo ${{ github.repository }}

  build:
    needs: prepare-description

    # Run this job even if prepare-description fails
    if: always()

    name: Build (${{ matrix.runtime }})
    strategy:
      matrix:
        include: ${{ fromJson(inputs.build-matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Publish ${{ matrix.runtime }}
        run: dotnet publish ${{ inputs.project }} -c Release -r ${{ matrix.runtime }} -o ${{ inputs.artifact-root != '' && format('./publish/{0}', inputs.artifact-root) || './publish' }}

      - name: Remove ignored files
        if: inputs.artifact-ignore != ''
        shell: bash
        run: |
          while IFS= read -r pattern; do
            pattern="$(echo "$pattern" | xargs)"
            [ -z "$pattern" ] && continue
            if [[ "$pattern" == */* ]]; then
              find publish -type f -path "publish/$pattern" -delete
            else
              find publish -type f -name "$pattern" -delete
            fi
          done <<< "${{ inputs.artifact-ignore }}"

      - name: Zip (${{ matrix.runtime }})
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd publish
          zip -r "../${{ inputs.artifact-name }}.${{ github.ref_name }}.${{ matrix.runtime }}.zip" .
          cd ..

      - name: Zip (${{ matrix.runtime }}, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "publish\*" -DestinationPath "${{ inputs.artifact-name }}.${{ github.ref_name }}.${{ matrix.runtime }}.zip"

      - name: Calculate SHA256
        shell: bash
        run: |
          ZIP_NAME="${{ inputs.artifact-name }}.${{ github.ref_name }}.${{ matrix.runtime }}.zip"
          HASH=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "## SHA256 Checksum (${{ matrix.runtime }})" >> $GITHUB_STEP_SUMMARY
          echo "\`${HASH}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.runtime }}
          path: ${{ inputs.artifact-name }}.${{ github.ref_name }}.${{ matrix.runtime }}.zip

  package:
    needs: build
    name: Package & Upload
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./zips
          merge-multiple: true

      - name: Upload ZIPs to Release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.ref_name }} ./zips/*.zip --repo ${{ github.repository }}

  finalize:
    needs: [build, package]
    
    # Run this job even if package fails so we can update the release description,
    # or to clean up the release if build fails
    if: always() && github.event_name == 'release'

    runs-on: ubuntu-slim
    name: Finalize Release

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BODY: ${{ github.event.release.body }}

    steps:
      - name: Delete release and tag on build failure
        if: needs.build.result == 'failure' || needs.build.result == 'cancelled'
        run: gh release delete ${{ github.ref_name }} --repo ${{ github.repository }} --yes --cleanup-tag

      - name: Set final release information
        if: needs.build.result != 'failure' && needs.build.result != 'cancelled'
        run: |
          if [ "${{ needs.package.result }}" == "success" ]; then
            STATUS_MSG="Assets were automatically generated using the [publish workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          else
            STATUS_MSG=$'> [!WARNING]\n> The [publish workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed. Some assets may be missing.'
          fi

          FINAL_BODY="${RELEASE_BODY}

          $STATUS_MSG"

          gh release edit ${{ github.ref_name }} -n "$FINAL_BODY" --repo ${{ github.repository }}
