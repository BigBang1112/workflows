name: Publish NuGet

on:
  workflow_call:
    inputs:
      package-prefix:
        description: Prefix filter for NuGet package selection (e.g. "MyCompany.")
        type: string
        default: ""
      project-path:
        description: Path(s) to build and pack. Supports wildcards (e.g. "src/**/*.csproj"). Defaults to the solution/project in the repo root.
        type: string
        default: ""
      test-path:
        description: Path(s) to test projects. Supports wildcards (e.g. "tests/**/*.csproj"). Defaults to all test projects discovered by dotnet.
        type: string
        default: ""
      pack-path:
        description: Path(s) to pack. Supports wildcards. Defaults to project-path, then the repo root.
        type: string
        default: ""
      dotnet-version:
        description: .NET version to use
        type: string
        default: latest
      workloads:
        description: Additional workloads to install (e.g. wasm-tools)
        type: string
        default: ""
      enable-tests:
        description: Run tests
        type: boolean
        default: true
      enable-coverage:
        description: Generate and publish code coverage summary
        type: boolean
        default: true
      push-to-nuget:
        description: Publish packages to NuGet.org
        type: boolean
        default: true
      push-to-github:
        description: Publish packages to GitHub Packages
        type: boolean
        default: true
      push-to-custom-feeds:
        description: Publish packages to custom NuGet feeds (requires custom-feed-urls and CUSTOM_FEED_API_KEYS)
        type: boolean
        default: false
      custom-feed-urls:
        description: Newline-separated list of custom NuGet feed source URLs to push packages to
        type: string
        default: ""
      upload-to-release:
        description: Upload packages to the GitHub Release
        type: boolean
        default: true
      nuget-username:
        description: NuGet.org username for Trusted Publishing (OIDC), used to obtain a short-lived API key when NUGET_API_KEY is not provided. See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
        type: string
        default: ""
      discord-top-lines:
        description: Newline-separated lines inserted below the heading, before the changelog, in the Discord message. Ignored if the Discord webhook secret isn't set.
        type: string
        default: ""
      discord-bottom-lines:
        description: Newline-separated lines appended at the very end of the Discord message. Ignored if the Discord webhook secret isn't set.
        type: string
        default: ""
    secrets:
      NUGET_API_KEY:
        required: false
      CUSTOM_FEED_API_KEYS:
        description: Newline-separated list of API keys matching the order of custom-feed-urls
        required: false
      DISCORD_WEBHOOK_URL:
        description: Discord webhook URL. When set, the release notes are posted to it, split to respect Discord's per-message character limit.
        required: false

permissions:
  contents: write # important for release description edit and asset upload
  packages: write
  # id-token: write # for NuGet Trusted Publishing (OIDC), see nuget-username input

jobs:
  build:
    name: Build & Pack
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BODY: ${{ github.event.release.body }}

    steps:
      - uses: actions/checkout@v6

      - name: Set release information
        if: github.event_name == 'release'
        continue-on-error: true
        run: |
          FINAL_BODY="***[Release is being automatically created, please wait...](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})***
            
          $RELEASE_BODY"
          gh release edit ${{ github.ref_name }} -n "$FINAL_BODY"

      - name: Set DOTNET_INSTALL_DIR
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          workloads: ${{ inputs.workloads }}

      - name: Build
        run: |
          if [ -n "${{ inputs.project-path }}" ]; then
            for project in ${{ inputs.project-path }}; do
              dotnet build "$project" -c Release -p:ContinuousIntegrationBuild=true
            done
          else
            dotnet build -c Release -p:ContinuousIntegrationBuild=true
          fi

      - name: Test
        if: inputs.enable-tests
        run: |
          if [ -n "${{ inputs.test-path }}" ]; then
            for project in ${{ inputs.test-path }}; do
              dotnet test "$project" -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage
            done
          else
            dotnet test -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage
          fi

      - name: Generate Code Coverage Summary
        if: inputs.enable-coverage
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coveragereport" -reporttypes:"MarkdownSummaryGithub"

      - name: Publish Coverage to Job Summary
        if: inputs.enable-coverage
        run: cat ./coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Pack
        run: |
          # Reads [project]/Changelog/v[Version].md, if present, into the PackageReleaseNotes property.
          resolve_release_notes() {
            local project="$1"
            local csproj="$project"
            [ -d "$project" ] && csproj=$(find "$project" -maxdepth 1 -name '*.csproj' | head -n 1)
            [ -z "$csproj" ] && return

            local props version
            props=$(dotnet msbuild "$csproj" -nologo -getProperty:Version,VersionPrefix 2>/dev/null) || props='{}'
            version=$(echo "$props" | jq -r '.Properties.VersionPrefix // empty')
            [ -z "$version" ] && version=$(echo "$props" | jq -r '.Properties.Version // empty')
            [ -z "$version" ] && return

            local project_dir changelog_file
            project_dir=$(dirname "$csproj")
            if [ "$project_dir" = "." ]; then
              changelog_file="Changelog/v${version}.md"
            else
              changelog_file="${project_dir}/Changelog/v${version}.md"
            fi
            [ -f "$changelog_file" ] || return

            local notes
            notes=$(cat "$changelog_file")
            notes="${notes//%/%25}"
            echo "${notes//;/%3B}"
          }

          pack_project() {
            local project="$1"
            shift

            local notes
            notes=$(resolve_release_notes "$project")

            if [ -n "$notes" ]; then
              dotnet pack "$project" -c Release "$@" --output ./packages -p:PackageReleaseNotes="$notes"
            else
              dotnet pack "$project" -c Release "$@" --output ./packages
            fi
          }

          if [ -n "${{ inputs.pack-path }}" ]; then
            for project in ${{ inputs.pack-path }}; do
              pack_project "$project"
            done
          elif [ -n "${{ inputs.project-path }}" ]; then
            for project in ${{ inputs.project-path }}; do
              pack_project "$project" --no-build
            done
          else
            while IFS= read -r project; do
              pack_project "$project" --no-build
            done < <(find . -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | sort -u)
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./packages/${{ inputs.package-prefix }}*.*nupkg

  publish:
    needs: build
    name: Publish Packages
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      # id-token: write # for NuGet Trusted Publishing (OIDC), see nuget-username input

    outputs:
      has-new: ${{ steps.notify.outputs.has-new }}
      main-id: ${{ steps.notify.outputs.main-id }}
      main-version: ${{ steps.notify.outputs.main-version }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_PREFIX: ${{ inputs.package-prefix }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./packages

      - name: NuGet login (Trusted Publishing OIDC)
        if: inputs.push-to-nuget && env.NUGET_API_KEY == '' && inputs.nuget-username != ''
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ inputs.nuget-username }}

      - name: Publish packages to feeds
        if: github.event_name != 'workflow_dispatch'
        env:
          NUGET_API_KEY: ${{ env.NUGET_API_KEY || steps.nuget_login.outputs.NUGET_API_KEY }}
          CUSTOM_FEED_URLS: ${{ inputs.custom-feed-urls }}
          CUSTOM_FEED_API_KEYS: ${{ secrets.CUSTOM_FEED_API_KEYS }}
        run: |
          > ./newly_pushed.txt
          
          # Prevents loop from running if no .nupkg files are found
          shopt -s nullglob

          for pkg in ./packages/${PACKAGE_PREFIX}*.nupkg; do
            pushed=false

            if [[ "${{ inputs.push-to-nuget }}" == "true" ]]; then
              out=$(dotnet nuget push "$pkg" -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json 2>&1) && rc=0 || rc=$?
              echo "$out"
              [[ $rc -eq 0 ]] && pushed=true || echo "$out" | grep -qiE "already exists|409|conflict" || exit $rc
            fi

            if [[ "${{ inputs.push-to-github }}" == "true" ]]; then
              out=$(dotnet nuget push "$pkg" -k "${{ secrets.GITHUB_TOKEN }}" -s https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json 2>&1) && rc=0 || rc=$?
              echo "$out"
              [[ $rc -eq 0 ]] && pushed=true || echo "$out" | grep -qiE "already exists|409|conflict" || exit $rc
            fi

            if [[ "${{ inputs.push-to-custom-feeds }}" == "true" && -n "$CUSTOM_FEED_URLS" ]]; then
              mapfile -t URLS <<< "$CUSTOM_FEED_URLS"
              mapfile -t KEYS <<< "$CUSTOM_FEED_API_KEYS"
              for i in "${!URLS[@]}"; do
                url="${URLS[$i]}"; key="${KEYS[$i]}"
                if [[ -n "$url" && -n "$key" ]]; then
                  out=$(dotnet nuget push "$pkg" -k "$key" -s "$url" 2>&1) && rc=0 || rc=$?
                  echo "$out"
                  [[ $rc -eq 0 ]] && pushed=true || echo "$out" | grep -qiE "already exists|409|conflict" || exit $rc
                fi
              done
            fi

            [[ "$pushed" == "true" ]] && echo "$pkg" >> ./newly_pushed.txt
          done

      - name: Resolve main package for notifications
        id: notify
        run: |
          declare -A pkg_versions
          packages=()

          if [[ -s ./newly_pushed.txt ]]; then
            while IFS= read -r pkg; do
              if [[ -n "$pkg" ]]; then
                filename=$(basename "$pkg")
                # Extract SemVer version and package name
                version=$(echo "$filename" | grep -oP '\d+\.\d+\.\d+.*(?=\.nupkg)')
                name=$(echo "$filename" | sed -E "s/\.${version}\.nupkg$//")

                pkg_versions["$name"]="$version"
                packages+=("$name")
              fi
            done < ./newly_pushed.txt
          fi

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "has-new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Picks the newly pushed package with the highest (semver) version
          main_pkg=$(
            for name in "${packages[@]}"; do
              printf '%s|%s\n' "${pkg_versions[$name]}" "$name"
            done | sort -t'|' -k1,1 -V | tail -n 1 | cut -d'|' -f2
          )

          echo "has-new=true" >> "$GITHUB_OUTPUT"
          echo "main-id=$main_pkg" >> "$GITHUB_OUTPUT"
          echo "main-version=${pkg_versions[$main_pkg]}" >> "$GITHUB_OUTPUT"

      - name: Upload packages to GitHub Release
        if: inputs.upload-to-release && github.event_name == 'release'
        run: |
          if [[ ! -s ./newly_pushed.txt ]]; then
            echo "No packages were newly pushed to any feed; skipping release upload."
            exit 0
          fi
          while IFS= read -r pkg; do
            if [[ -n "$pkg" ]]; then
              gh release upload ${{ github.ref_name }} "$pkg" --repo ${{ github.repository }}
            fi
          done < ./newly_pushed.txt

  discord:
    needs: [build, publish]
    if: always() && github.event_name == 'release' && needs.publish.result == 'success' && needs.publish.outputs.has-new == 'true'
    name: Notify Discord
    runs-on: ubuntu-slim

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RELEASE_BODY: ${{ github.event.release.body }}

    steps:
      - name: Send announcement to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          TOP_LINES: ${{ inputs.discord-top-lines }}
          BOTTOM_LINES: ${{ inputs.discord-bottom-lines }}
          TAG: ${{ github.ref_name }}
          MAIN_ID: ${{ needs.publish.outputs.main-id }}
          MAIN_VERSION: ${{ needs.publish.outputs.main-version }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PUSH_TO_NUGET: ${{ inputs.push-to-nuget }}
        run: |
          set -euo pipefail

          {
            echo "## ${TAG}"
            if [ -n "$TOP_LINES" ]; then
              echo "$TOP_LINES"
            fi
            echo
            echo "$RELEASE_BODY"
            echo
            echo "GitHub: [Release Link](<${RELEASE_URL}>)"
            if [ "$PUSH_TO_NUGET" = "true" ]; then
              echo "NuGet: [Package Link](<https://www.nuget.org/packages/${MAIN_ID}/${MAIN_VERSION}>)"
            fi
            if [ -n "$BOTTOM_LINES" ]; then
              echo "$BOTTOM_LINES"
            fi
          } > discord_message.md

          # Split into <=2000 char chunks, only breaking on line boundaries.
          LIMIT=2000
          CONTENT="$(cat discord_message.md)"
          i=0
          while [ -n "$CONTENT" ]; do
            if [ "${#CONTENT}" -le "$LIMIT" ]; then
              CHUNK="$CONTENT"
              CONTENT=""
            else
              HEAD="${CONTENT:0:$LIMIT}"
              CUT=$(printf '%s' "$HEAD" | grep -bo $'\n' | tail -1 | cut -d: -f1)
              if [ -z "$CUT" ]; then
                CUT=$LIMIT
                CHUNK="${CONTENT:0:$CUT}"
                CONTENT="${CONTENT:$CUT}"
              else
                CHUNK="${CONTENT:0:$CUT}"
                CONTENT="${CONTENT:$((CUT+1))}"
              fi
            fi
            printf '%s' "$CHUNK" > "chunk_$(printf '%03d' "$i").md"
            i=$((i+1))
          done

          for f in chunk_*.md; do
            PAYLOAD=$(jq -Rs '{content: .}' < "$f")
            curl -fsSL -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          done

  finalize:
    needs: [build, publish]

    # Run this job even if package fails so we can update the release description,
    # or to clean up the release if build fails
    if: always() && github.event_name == 'release'

    runs-on: ubuntu-slim
    name: Finalize Release

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BODY: ${{ github.event.release.body }}

    steps:
      - name: Delete release and tag on build failure
        if: needs.build.result == 'failure' || needs.build.result == 'cancelled'
        run: gh release delete ${{ github.ref_name }} --repo ${{ github.repository }} --yes --cleanup-tag

      - name: Set final release information
        if: needs.build.result != 'failure' && needs.build.result != 'cancelled'
        run: |
          if [ "${{ needs.publish.result }}" == "success" ]; then
            STATUS_MSG="Assets were automatically generated using the [publish workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          else
            STATUS_MSG=$'> [!WARNING]\n> The [publish workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed. Some assets may be missing.'
          fi

          FINAL_BODY="${RELEASE_BODY}

          $STATUS_MSG"

          gh release edit ${{ github.ref_name }} -n "$FINAL_BODY" --repo ${{ github.repository }}
