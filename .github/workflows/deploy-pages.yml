name: Deploy to Pages

on:
  workflow_call:
    inputs:
      project:
        description: 'Path to the Blazor WASM project to publish (e.g. src/MyApp)'
        type: string
        required: true
      dotnet-version:
        description: '.NET version to use'
        type: string
        default: 'latest'
      install-wasm-tools:
        description: 'Install the wasm-tools workload'
        type: boolean
        default: true
      enable-cache:
        description: 'Cache NuGet packages'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet Packages
        if: inputs.enable-cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
          
      - name: Install wasm-tools
        if: inputs.install-wasm-tools
        run: dotnet workload install wasm-tools

      - name: Patch base href in index.html
        run: sed -i 's/<base href="\/" \/>/<base href="\/${{ github.event.repository.name }}\/" \/>/g' ${{ inputs.project }}/wwwroot/index.html

      - name: Patch base in service-worker.published.js
        run: sed -i 's/const base = "\//const base = "\/${{ github.event.repository.name }}\//g' ${{ inputs.project }}/wwwroot/service-worker.published.js

      - name: Publish
        run: dotnet publish ${{ inputs.project }} -c Release -o publish
        
      - name: Add .nojekyll file
        run: touch publish/wwwroot/.nojekyll
        
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot/.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5