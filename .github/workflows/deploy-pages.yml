name: Deploy to Pages

on:
  workflow_call:
    inputs:
      project:
        description: 'Path to the Blazor WASM project to publish (e.g. src/MyApp)'
        type: string
        required: true
      dotnet-version:
        description: '.NET version to use'
        type: string
        default: 'latest'
      workloads:
        description: 'Additional workloads to install (e.g. wasm-tools)'
        type: string
        default: 'wasm-tools'
      enable-cache:
        description: 'Cache NuGet packages'
        type: boolean
        default: true
      enable-coverage:
        description: 'Generate HTML coverage report and publish it to /coverage/ on the site'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set DOTNET_INSTALL_DIR
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> $GITHUB_ENV

      - name: Cache Workloads
        if: inputs.workloads != ''
        id: cache-workloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.dotnet/metadata
            ~/.dotnet/packs
            ~/.dotnet/library-packs
          key: ${{ runner.os }}-workloads-${{ inputs.dotnet-version }}-${{ inputs.workloads }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          workloads: ${{ inputs.workloads }}

      - name: Cache NuGet Packages
        if: inputs.enable-cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test
        if: inputs.enable-coverage
        continue-on-error: true
        run: dotnet test -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Patch base href in index.html
        run: sed -i 's/<base href="\/" \/>/<base href="\/${{ github.event.repository.name }}\/" \/>/g' ${{ inputs.project }}/wwwroot/index.html

      - name: Patch base in service-worker.published.js
        run: sed -i 's/const base = "\//const base = "\/${{ github.event.repository.name }}\//g' ${{ inputs.project }}/wwwroot/service-worker.published.js

      - name: Publish
        run: dotnet publish ${{ inputs.project }} -c Release -o publish
        
      - name: Generate Coverage Report
        if: inputs.enable-coverage
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"publish/wwwroot/coverage" -reporttypes:"Html"

      - name: Add .nojekyll file
        run: touch publish/wwwroot/.nojekyll
        
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot/.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5