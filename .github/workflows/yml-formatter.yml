name: YML Formatter

on:
  workflow_call:
    inputs:
      yamlfmt-version:
        description: yamlfmt version to install (e.g. 0.21.0)
        type: string
        default: "0.21.0"
      args:
        description: "Arguments passed to yamlfmt (default: .)"
        type: string
        default: "."
      auto-commit:
        description: Commit and push formatted files back to the branch
        type: boolean
        default: false
      lint:
        description: Run in lint mode (fail if files are not formatted)
        type: boolean
        default: false

jobs:
  ymlfmt:
    name: YML Formatter
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install yamlfmt
        run: |
          VERSION="${{ inputs.yamlfmt-version }}"
          curl -fsSL "https://github.com/google/yamlfmt/releases/download/v${VERSION}/yamlfmt_${VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin yamlfmt

      - name: Run yamlfmt
        run: yamlfmt ${{ inputs.lint && '-lint' || '' }} ${{ inputs.args }}

      - name: Commit changes
        if: inputs.auto-commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-format YML files"
          git push
