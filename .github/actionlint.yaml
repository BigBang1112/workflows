paths:
  .github/workflows/{check-agent-authorship,publish-nuget-immutable}.yml:
    ignore:
      # These job context properties exist, but actionlint 1.7.12 doesn't know them yet.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
      - 'property "workflow_(repository|sha)" is not defined'
